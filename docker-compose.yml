services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      - backend
  
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - database

  database:
    image: mongo
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "database.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  my-network:

volumes:
  mongodb_data:

